<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191516">
  <meta name="robots" content="noindex, nofollow">
  <title>For Day, with love.</title>
  <meta name="description" content="Una pequeña sorpresa para vos.">
  <link rel="preload" href="assets/fonts/cormorant.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/caveat.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23191516'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23B69A68' stroke-width='1'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23C78F91'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="petal-layer" id="petals" aria-hidden="true"></div>

  <main id="app">

    <!-- ================= ESCENA 1 · LA INVITACIÓN ================= -->
    <section class="scene scene-invite is-active" id="scene-0" data-scene="0" aria-label="La invitación">
      <div class="invite-glow" aria-hidden="true"></div>
      <header class="invite-head">
        <h1 class="invite-title" data-text="invitation.title"></h1>
        <p class="invite-sub" data-text="invitation.subtitle"></p>
      </header>

      <div class="env-field" id="envField">
      <div class="env-slot" id="slotCorrect"><div class="env-wobble">
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Sobre que dice: para Day">
        <div class="env-back"></div>
        <div class="env-card" id="envCard">
          <div class="card-inner">
            <span class="card-date" data-text="invitation.cardDate"></span>
            <h2 class="card-title" data-text="invitation.cardTitle"></h2>
            <div class="card-sprig" data-art="sprig"></div>
            <button class="btn btn-primary" id="openWorld" type="button" data-text="invitation.button" tabindex="-1"></button>
          </div>
        </div>
        <svg class="env-front" viewBox="0 0 320 210" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="envL" x1="0" x2="1"><stop offset="0" stop-color="#e6d6bb"/><stop offset="1" stop-color="#ddcaa9"/></linearGradient>
            <linearGradient id="envB" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e9dbc2"/><stop offset="1" stop-color="#e2d0b2"/></linearGradient>
          </defs>
          <path d="M0 0 L160 118 L0 210 Z" fill="url(#envL)"/>
          <path d="M320 0 L160 118 L320 210 Z" fill="#dac7a6"/>
          <path d="M0 210 L160 96 L320 210 Z" fill="url(#envB)"/>
          <path d="M0 210 L160 96 L320 210" fill="none" stroke="rgba(120,90,60,.25)" stroke-width="1"/>
          <text x="160" y="184" text-anchor="middle" class="env-to" data-text="invitation.correctLabel">para Day</text>
        </svg>
        <div class="env-flap" id="envFlap">
          <svg viewBox="0 0 320 130" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 0 L320 0 L172 122 Q160 131 148 122 Z" fill="#e8d9bf" stroke="rgba(120,90,60,.22)" stroke-width="1"/>
          </svg>
          <img class="env-seal" src="assets/illustrations/seal.webp" alt="" width="70" height="70">
        </div>
      </div>
      </div></div>
      </div>
      <p class="invite-hint" id="inviteHint" data-text="invitation.hint" aria-live="polite"></p>
    </section>

    <!-- ================= ESCENA 2 · NUESTRO VINILO ================= -->
    <section class="scene scene-vinyl" id="scene-1" data-scene="1" aria-label="Nuestro vinilo">
      <div class="lamp" aria-hidden="true"></div>
      <div class="scene-scroll">
        <header class="scene-head">
          <span class="kicker" data-text="music.sceneKicker"></span>
          <h2 class="scene-title" data-text="music.sceneTitle"></h2>
        </header>

        <div class="turntable-wrap">
          <svg class="turntable" id="turntable" viewBox="0 0 400 330" role="img" aria-label="Tocadiscos con un disco de vinilo">
            <defs>
              <pattern id="woodPat" patternUnits="userSpaceOnUse" width="400" height="330">
                <image href="assets/textures/wood.webp" x="0" y="0" width="420" height="330" preserveAspectRatio="xMidYMid slice"/>
              </pattern>
              <linearGradient id="woodShade" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
                <stop offset=".5" stop-color="#000" stop-opacity="0"/>
                <stop offset="1" stop-color="#000" stop-opacity=".35"/>
              </linearGradient>
              <radialGradient id="platter" cx=".5" cy=".5" r=".5">
                <stop offset=".82" stop-color="#6d6866"/><stop offset=".9" stop-color="#b7b0aa"/><stop offset=".95" stop-color="#5a5452"/><stop offset="1" stop-color="#8d8682"/>
              </radialGradient>
              <radialGradient id="vinylBase" cx=".5" cy=".5" r=".5">
                <stop offset="0" stop-color="#231c1d"/><stop offset=".7" stop-color="#151112"/><stop offset="1" stop-color="#0d0a0b"/>
              </radialGradient>
              <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity="0"/>
                <stop offset=".42" stop-color="#fff" stop-opacity=".0"/>
                <stop offset=".5" stop-color="#fff5e6" stop-opacity=".16"/>
                <stop offset=".58" stop-color="#fff" stop-opacity="0"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#e9e2d6"/><stop offset=".45" stop-color="#a49b8f"/><stop offset=".55" stop-color="#d6cdbf"/><stop offset="1" stop-color="#7d756b"/>
              </linearGradient>
              <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="6"/>
              </filter>
            </defs>

            <!-- sombra de la base -->
            <rect x="18" y="30" width="370" height="292" rx="18" fill="#000" opacity=".55" filter="url(#softShadow)"/>
            <!-- base de madera -->
            <rect x="10" y="14" width="380" height="296" rx="16" fill="url(#woodPat)"/>
            <rect x="10" y="14" width="380" height="296" rx="16" fill="url(#woodShade)"/>
            <rect x="11" y="15" width="378" height="294" rx="15" fill="none" stroke="rgba(255,226,180,.18)"/>
            <rect x="22" y="26" width="356" height="272" rx="10" fill="none" stroke="rgba(0,0,0,.35)"/>

            <!-- plato -->
            <circle cx="160" cy="165" r="132" fill="#000" opacity=".5" filter="url(#softShadow)"/>
            <circle cx="160" cy="162" r="132" fill="url(#platter)"/>

            <!-- disco (gira) -->
            <g id="record" class="record">
              <circle cx="160" cy="162" r="124" fill="url(#vinylBase)"/>
              <g id="grooves" fill="none"></g>
              <circle cx="160" cy="162" r="42" fill="var(--rosa)"/>
              <circle cx="160" cy="162" r="42" fill="none" stroke="rgba(25,21,22,.35)" stroke-width="1"/>
              <circle cx="160" cy="162" r="36" fill="none" stroke="rgba(72,29,42,.35)" stroke-width=".6" stroke-dasharray="2 3"/>
              <text x="160" y="152" class="lbl-small" text-anchor="middle">FOR DAY, WITH LOVE</text>
              <text x="160" y="172" class="lbl-big" text-anchor="middle" data-text="music.labelTop"></text>
              <text x="160" y="186" class="lbl-small" text-anchor="middle" data-text="music.labelBottom"></text>
              <path d="M160 128 l2.2 4.4 -2.2 4.4 -2.2 -4.4z" fill="var(--bordo)" opacity=".7"/>
            </g>
            <!-- brillo fijo (no gira, así el reflejo se ve real) -->
            <circle cx="160" cy="162" r="124" fill="url(#sheen)" pointer-events="none"/>
            <path d="M74 98 A108 108 0 0 1 140 58" stroke="#fff" stroke-opacity=".07" stroke-width="18" fill="none" stroke-linecap="round" pointer-events="none"/>
            <circle cx="160" cy="162" r="4.5" fill="url(#metal)"/>
            <circle cx="160" cy="162" r="1.6" fill="#4a4440"/>

            <!-- perillas y detalles -->
            <g class="tt-details">
              <circle cx="352" cy="262" r="15" fill="#1b1617" stroke="url(#metal)" stroke-width="3"/>
              <line x1="352" y1="262" x2="352" y2="251" stroke="var(--dorado)" stroke-width="2" stroke-linecap="round"/>
              <text x="352" y="292" class="tt-label" text-anchor="middle">VOL</text>
              <circle cx="306" cy="280" r="4" id="powerLed" class="led"/>
              <text x="306" y="295" class="tt-label" text-anchor="middle">ON</text>
              <rect x="30" y="282" width="52" height="14" rx="7" fill="#1b1617" stroke="rgba(182,154,104,.6)"/>
              <circle id="speedKnob" cx="40" cy="289" r="5" fill="url(#metal)"/>
              <text x="30" y="276" class="tt-label">33</text><text x="70" y="276" class="tt-label">45</text>
            </g>

            <!-- brazo (rota sobre el pivote) -->
            <g id="tonearm" class="tonearm">
              <circle cx="338" cy="70" r="24" fill="#000" opacity=".35" filter="url(#softShadow)"/>
              <circle cx="338" cy="66" r="22" fill="url(#metal)"/>
              <circle cx="338" cy="66" r="13" fill="#2a2425"/>
              <circle cx="338" cy="66" r="6" fill="url(#metal)"/>
              <rect x="331" y="28" width="14" height="22" rx="3" fill="#2a2425" stroke="url(#metal)" stroke-width="1.5"/>
              <path d="M338 66 L338 196 Q338 214 324 226 L312 236" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="7" stroke-linecap="round" transform="translate(4 5)"/>
              <path d="M338 66 L338 196 Q338 214 324 226 L312 236" fill="none" stroke="url(#metal)" stroke-width="5" stroke-linecap="round"/>
              <rect x="298" y="230" width="22" height="13" rx="2.5" transform="rotate(-38 309 236)" fill="#2a2425" stroke="url(#metal)" stroke-width="1.2"/>
            </g>
          </svg>
        </div>

        <div class="player-ui">
          <div class="track-info">
            <div class="waves" id="waves" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
            <div>
              <p class="track-title" data-text="music.title"></p>
              <p class="track-artist" data-text="music.artist"></p>
            </div>
          </div>

          <div class="controls">
            <button class="play-btn" id="playBtn" type="button" aria-label="Reproducir" disabled>
              <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
              <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg>
            </button>
            <div class="progress-wrap">
              <div class="progress" id="progress" role="progressbar" aria-label="Progreso de la canción" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progressFill"></span></div>
              <div class="times"><span id="tCur">0:00</span><span id="playerStatus">Cargando…</span><span id="tDur">–:––</span></div>
            </div>
          </div>

          <label class="volume" id="volumeRow">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input type="range" id="volume" min="0" max="100" value="70" aria-label="Volumen">
          </label>
          <p class="ios-note" id="iosNote" hidden data-text="music.iosVolumeNote"></p>

          <p class="song-quote" id="songQuote" data-text="music.quote"></p>

          <div class="yt-frame">
            <div class="yt-ratio"><div id="ytPlayer"></div></div>
          </div>
          <p class="yt-note" id="ytNote" data-text="music.fallbackNote"></p>
        </div>
      </div>
    </section>

    <!-- ================= ESCENA 3 · OCHO MESES, UNA HISTORIA ================= -->
    <section class="scene scene-story" id="scene-2" data-scene="2" aria-label="Ocho meses, una historia">
      <div class="scene-scroll">
        <header class="scene-head">
          <span class="kicker">III</span>
          <h2 class="scene-title" data-text="story.sceneTitle"></h2>
        </header>
        <div class="moments" id="moments" aria-live="polite"></div>
        <div class="moment-nav">
          <button class="icon-btn" id="momPrev" type="button" aria-label="Fecha anterior">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="moment-dots" id="momDots"></div>
          <button class="icon-btn" id="momNext" type="button" aria-label="Fecha siguiente">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ================= ESCENA 4 · DOS LUGARES, UN SENTIMIENTO ================= -->
    <section class="scene scene-distance" id="scene-3" data-scene="3" aria-label="Dos lugares, un sentimiento">
      <canvas id="sky" class="sky" aria-hidden="true"></canvas>
      <div class="scene-scroll distance-inner">
        <header class="scene-head">
          <span class="kicker">IV</span>
          <h2 class="scene-title" data-text="distance.sceneTitle"></h2>
        </header>
        <div class="map-stage" id="mapStage">
          <svg viewBox="0 0 300 300" class="dist-svg" aria-hidden="true">
            <defs>
              <radialGradient id="glow"><stop offset="0" stop-color="#fff3d6"/><stop offset=".25" stop-color="#e8c98e"/><stop offset="1" stop-color="#e8c98e" stop-opacity="0"/></radialGradient>
            </defs>
            <path id="distArc" class="dist-arc" d="M78 70 C 150 70, 240 140, 214 236" fill="none"/>
            <path class="dist-arc-glow" d="M78 70 C 150 70, 240 140, 214 236" fill="none"/>
          </svg>
          <div class="light light-a" id="lightA"><span class="halo"></span><span class="core"></span><em data-text="distance.placeB"></em></div>
          <div class="light light-b" id="lightB"><span class="halo"></span><span class="core"></span><em data-text="distance.placeA"></em></div>
        </div>
        <p class="dist-text" id="distText" data-text="distance.text"></p>
        <button class="btn btn-ghost" id="closerBtn" type="button" data-text="distance.button"></button>
      </div>
    </section>

    <!-- ================= ESCENA 5 · LA CARTA ================= -->
    <section class="scene scene-letter" id="scene-4" data-scene="4" aria-label="La carta">
      <div class="scene-scroll">
        <article class="letter" id="letter" aria-live="polite">
          <div class="letter-flora" data-art="corner"></div>
          <h2 class="letter-title" data-text="letter.title"></h2>
          <div class="letter-body" id="letterBody"></div>
          <p class="letter-hint" id="letterHint" data-text="letter.skipHint"></p>
        </article>
        <div class="finale" id="finale">
          <div class="finale-flowers" data-art="bouquet"></div>
          <svg class="finale-heart" viewBox="0 0 120 110" aria-hidden="true">
            <path class="draw" d="M60 98 C 30 76, 8 58, 12 34 C 16 14, 42 8, 58 30 C 60 33, 61 33, 63 29 C 78 6, 108 12, 108 38 C 108 60, 86 78, 62 99 C 58 103, 52 96, 48 92" fill="none"/>
          </svg>
          <p class="final-line" data-text="letter.finalLine"></p>
          <p class="signature" data-text="letter.signature"></p>
          <button class="btn btn-ghost small" id="restartBtn" type="button" data-text="nav.restart"></button>
        </div>
      </div>
    </section>
  </main>

  <!-- navegación inferior -->
  <nav class="nav" id="nav" aria-label="Escenas">
    <button class="nav-btn" id="prevBtn" type="button"><span aria-hidden="true">←</span> <span data-text="nav.prev"></span></button>
    <div class="nav-dots" id="navDots"></div>
    <button class="nav-btn" id="nextBtn" type="button"><span data-text="nav.next"></span> <span aria-hidden="true">→</span></button>
  </nav>

  <!-- mini reproductor (aparece cuando suena la música fuera de la escena del vinilo) -->
  <button class="mini-player" id="miniPlayer" type="button" aria-label="Pausar la música" hidden>
    <span class="mini-disc"></span>
  </button>

  <script src="config.js?v=5"></script>
  <script src="script.js?v=5"></script>
</body>
</html>
